name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Analyze, test, and build
        shell: pwsh
        run: |
          & ./build/Invoke-CI.ps1

  window:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the WPF window with Windows PowerShell 5.1
        shell: powershell
        env:
          WINTOOL_SHOT_DIR: ${{ runner.temp }}\wintool-shots
        run: powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-WinToolUiBuild.ps1

      - name: Open and close WinTool, then check nothing is left running
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\Test-WinToolLifecycle.ps1

      - name: Upload window screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}\wintool-shots
          if-no-files-found: ignore

  wsl-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the WSL shell setup in an existing Ubuntu
        run: docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash /src/tests/Test-WslSetup.sh /src
